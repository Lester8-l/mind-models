<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100個思維模型 · 檀東東Tango</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#faf9f7; --paper:#f4f0e6; --charcoal:#14201b;
  --ink-soft:#6b6256; --mute:#a8a6a0; --faint:#c9c6bd;
  --forest:#2e5e4e; --forest-deep:#234839; --forest-soft:#3d6b58; --forest-tint:#e7efeb;
  --gold:#b8893b; --gold-soft:#c9a464; --gold-pale:#e8d5a3;
  --line:rgba(20,32,27,.1); --line-strong:rgba(20,32,27,.16);
  --ease:cubic-bezier(0.22,0.61,0.36,1);
  --font-serif:'Cormorant Garamond','Noto Serif TC','Songti TC','STSong',serif;
  --font-ui:'Noto Sans TC',ui-sans-serif,system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --radius-card:18px; --radius-pill:9999px; --radius-badge:4px;
  --fs-h1:clamp(2.5rem,6vw,4rem); --fs-h2:clamp(1.9rem,4vw,2.6rem); --fs-h3:clamp(1.15rem,2vw,1.45rem);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--charcoal);font-family:var(--font-ui);line-height:1.7;font-weight:400;-webkit-font-smoothing:antialiased;font-size:clamp(1rem,1.05vw,1.0625rem)}
::selection{background:rgba(184,137,59,.28)}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
@media(max-width:720px){.wrap{padding:0 20px}}

/* ===== 导航 ===== */
nav{background:rgba(250,249,247,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:150}
nav .wrap{display:flex;align-items:center;height:68px;gap:20px}
.brand{display:flex;align-items:center;gap:9px;color:var(--charcoal);text-decoration:none;font-family:var(--font-serif);font-size:19px;font-weight:600;letter-spacing:.02em}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);display:inline-block}
.nav-meta{margin-left:auto;font-size:13.5px;color:var(--mute)}

/* ===== Hero ===== */
.hero{padding:clamp(52px,8vw,96px) 0 clamp(34px,5vw,60px)}
.eyebrow{font-size:.8125rem;color:var(--gold);margin-bottom:22px;display:flex;align-items:center;gap:12px;letter-spacing:.14em;font-weight:600;text-transform:uppercase}
.eyebrow::before{content:"";width:22px;height:1.5px;background:currentColor;opacity:.65}
.hero h1{font-size:var(--fs-h1);font-weight:600;line-height:1.16;letter-spacing:0;color:var(--charcoal);font-family:var(--font-serif)}
.hero .sub{margin-top:22px;font-size:17px;color:var(--ink-soft);max-width:640px;line-height:1.9}
.hero-meta{margin-top:26px;display:flex;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.hero-meta span{display:inline-flex;align-items:center;gap:8px}
.hero-meta span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold-soft)}

/* ===== 工具条：搜索 + 分类标签 ===== */
.toolbar{position:sticky;top:68px;z-index:120;background:rgba(250,249,247,.9);backdrop-filter:blur(10px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0}
.toolbar .wrap{display:flex;flex-direction:column;gap:14px}
.search-row{display:flex;gap:16px;align-items:center}
.search-box{flex:1;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-pill);padding:13px 22px;transition:border-color .25s var(--ease)}
.search-box:focus-within{border-color:var(--gold)}
.search-box svg{flex:none;opacity:.45}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--charcoal);font-size:15px;font-family:var(--font-ui)}
.search-box input::placeholder{color:var(--mute)}
.result-count{font-size:14px;color:var(--mute);white-space:nowrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font-size:14px;color:var(--ink-soft);background:transparent;border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:8px 18px;cursor:pointer;transition:.25s var(--ease);font-family:var(--font-ui);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tab small{opacity:.6;font-size:12.5px}
.tab:hover{color:var(--forest);border-color:var(--forest)}
.tab.on{background:var(--forest);color:#f7f5f0;border-color:var(--forest)}
.tab.on small{opacity:.85}

/* ===== 分类简介 ===== */
.cat-intro{margin:34px 0 6px;display:none}
.cat-intro.show{display:block;animation:fade .4s var(--ease)}
.cat-intro .ci-head{display:flex;align-items:center;gap:12px}
.cat-intro .ci-bar{width:5px;height:30px;border-radius:3px;background:var(--cc,var(--forest))}
.cat-intro h2{font-size:var(--fs-h2);font-weight:600;color:var(--charcoal);font-family:var(--font-serif);line-height:1.2}
.cat-intro p{color:var(--ink-soft);font-size:15px;margin-top:10px;max-width:720px;line-height:1.85}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 卡片网格 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:18px;padding:34px 0 90px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-card);padding:26px 26px 24px;cursor:pointer;transition:border-color .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease);display:flex;flex-direction:column;gap:11px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cc,var(--forest))}
.card:hover{border-color:var(--gold-soft);transform:translateY(-3px);box-shadow:0 14px 30px rgba(20,32,27,.08)}
.card .no{font-size:12.5px;color:var(--mute);letter-spacing:1px;font-family:var(--font-serif);font-weight:600}
.card h3{font-size:20px;font-weight:600;line-height:1.4;color:var(--charcoal);font-family:var(--font-serif);letter-spacing:.01em}
.card .tag{font-size:14.5px;color:var(--ink-soft);line-height:1.75;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto;padding-top:6px}
.chip{font-size:12.5px;border-radius:var(--radius-pill);padding:3px 12px;color:#fff;background:var(--cc,var(--forest));white-space:nowrap}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:70px 0;font-size:15px}

/* ===== 详情（页内全屏，非弹窗） ===== */
.detail{position:fixed;inset:0;z-index:200;background:var(--cream);overflow-y:auto;display:none}
.detail.open{display:block;animation:fade .3s var(--ease)}
.detail-bar{position:sticky;top:0;z-index:10;background:rgba(250,249,247,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.detail-bar .wrap{display:flex;align-items:center;height:66px;gap:18px}
.back-btn{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line-strong);color:var(--charcoal);border-radius:var(--radius-pill);padding:10px 20px;font-size:14px;cursor:pointer;font-family:var(--font-ui);transition:.25s var(--ease)}
.back-btn:hover{border-color:var(--forest);color:var(--forest)}
.detail-bar .crumb{font-size:14px;color:var(--mute);letter-spacing:.04em}
.detail-body{padding:clamp(40px,6vw,72px) 24px 120px;max-width:740px;margin:0 auto}
.d-top{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mute);margin-bottom:18px;flex-wrap:wrap}
.d-top .no{color:var(--ink-soft);font-family:var(--font-serif);font-weight:600}
.d-top .cat{background:var(--paper);color:var(--ink-soft);border-radius:var(--radius-badge);padding:3px 12px;font-size:13px}
.d-title{font-size:var(--fs-h1);font-weight:600;line-height:1.18;letter-spacing:0;color:var(--charcoal);font-family:var(--font-serif);margin-bottom:14px}
.d-tag{font-size:17px;color:var(--ink-soft);line-height:1.8;max-width:680px;margin-bottom:40px}
.d-sec{margin-bottom:40px}
.d-sec h4{font-size:.8125rem;color:var(--gold);margin-bottom:16px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.d-sec h4::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--cc,var(--gold))}
.d-core{font-size:19px;line-height:1.9;color:var(--charcoal);max-width:680px;font-family:var(--font-serif);font-weight:500}
.d-pts{list-style:none;display:flex;flex-direction:column;gap:13px;max-width:680px}
.d-pts li{font-size:16.5px;color:var(--charcoal);padding-left:28px;position:relative;line-height:1.85}
.d-pts li::before{content:"";position:absolute;left:4px;top:11px;width:9px;height:9px;border-radius:3px;background:var(--cc,var(--gold))}
.d-text{font-size:16px;color:var(--charcoal);line-height:1.95;max-width:680px}
.d-box{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-card);padding:22px 26px}
.d-box p{font-size:16px;color:var(--charcoal);line-height:1.95;max-width:680px}
.rel-chips{display:flex;flex-wrap:wrap;gap:9px}
.rel-chip{border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:6px 16px;font-size:14px;cursor:pointer;color:var(--ink-soft);transition:.2s var(--ease);background:var(--cream)}
.rel-chip:hover{border-color:var(--cc,var(--forest));color:var(--cc,var(--forest));background:var(--forest-tint)}
.rel-chip.off{opacity:.45;cursor:default}
.rel-chip.off:hover{border-color:var(--line-strong);color:var(--ink-soft);background:var(--cream)}
.d-foot{border-top:1px dashed var(--line-strong);padding-top:22px;margin-top:8px;font-size:14.5px;color:var(--ink-soft)}
.d-foot a{color:var(--forest);text-decoration:none;font-weight:500}
.d-foot a:hover{text-decoration:underline}
.d-next{margin-top:46px;padding-top:26px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.d-next a{color:var(--forest);text-decoration:none;font-family:var(--font-serif);font-size:17px;font-weight:600}
.d-next a:hover{color:var(--forest-deep)}
.d-next .lbl{font-size:12.5px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}

footer{border-top:1px solid var(--line);padding:40px 0 60px;text-align:center;color:var(--mute);font-size:13.5px;line-height:1.9}
footer a{color:var(--ink-soft);text-decoration:none}
footer a:hover{color:var(--forest)}

@media(max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}
  .card{padding:20px 18px}
  .card h3{font-size:18px}
  .search-row{flex-direction:column;align-items:stretch}
  .result-count{text-align:center}
  .detail-body{padding:36px 20px 90px}
  .d-core{font-size:17.5px}
}

/*__EDITOR_CSS__*/
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="#top"><span class="dot"></span>100個思維模型</a>
    <div class="nav-meta" id="navMeta"></div>
  </div>
</nav>

<header class="hero" id="top">
  <div class="wrap">
    <div class="eyebrow">檀東東 Tango · 《100個思維模型》合集</div>
    <h1>100 個思維模型<br>把複雜世界，拆成可學的招式</h1>
    <p class="sub">從 B 站「檀東東Tango」《100個思維模型》合集轉寫整理。按「五根」分類——想清楚、做到位、說得好、帶得動、走得遠，學一個模型，多一把鑰匙。</p>
    <div class="hero-meta">
      <span id="metaCount">共收錄 — 個模型</span>
      <span>五根分類 · 5 大維度</span>
      <span>轉寫整理 · 便於檢索</span>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <div class="search-row">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="q" type="text" placeholder="搜索模型名稱、關鍵詞（如：復盤、會議、決策）…">
      </div>
      <div class="result-count" id="rc"></div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
</div>

<main class="wrap" id="home">
  <div class="cat-intro" id="catIntro"></div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="wrap">
    內容來源：B 站「檀東東Tango」《100個思維模型》合集 · 本頁為轉寫整理版，僅供學習參考<br>
    點擊任意模型卡片可查看完整拆解 · 按 <b>Esc</b> 或「返回」回到列表
  </div>
</footer>

<!-- 详情（页内全屏，非弹窗） -->
<div class="detail" id="detail">
  <div class="detail-bar">
    <div class="wrap">
      <button class="back-btn" onclick="closeDetail()">← 返回列表</button>
      <div class="crumb" id="crumb"></div>
    </div>
  </div>
  <div class="detail-body" id="detailBody"></div>
</div>

<script src="data.js"></script>
<script>
/* 资料来自 data.js（CATS / MODELS），可单独编辑后刷新页面生效 */

/* 五根对应的纸墨风配色（克制、自然） */
const CAT_COLOR = {
  "想清楚":"#3d6b58",
  "做到位":"#b8893b",
  "說得好":"#c2683f",
  "帶得動":"#7a8a5c",
  "走得遠":"#6b7fa3"
};
const cc = c => CAT_COLOR[c] || "#2e5e4e";

const grid = document.getElementById('grid');
const tabsEl = document.getElementById('tabs');
const catIntro = document.getElementById('catIntro');
const qInput = document.getElementById('q');
const rc = document.getElementById('rc');
const detail = document.getElementById('detail');
const detailBody = document.getElementById('detailBody');
const crumb = document.getElementById('crumb');

let curCat = '全部';
const byName = {};
MODELS.forEach(m => { byName[m.name] = m; });
const noMap = {};
MODELS.forEach(m => { noMap[m.no] = m; });

/* 顶部计数 */
document.getElementById('metaCount').textContent = '共收錄 ' + MODELS.length + ' 個模型';
document.getElementById('navMeta').textContent = MODELS.length + ' 個模型 · 五根分類';

/* 分类标签 */
const catNames = ['全部', ...Object.keys(CATS)];
tabsEl.innerHTML = catNames.map(c=>{
  const n = c==='全部' ? MODELS.length : MODELS.filter(m=>m.cat===c).length;
  return `<div class="tab${c==='全部'?' on':''}" data-cat="${c}">${c}<small>${n}</small></div>`;
}).join('');
tabsEl.addEventListener('click', e=>{
  const t = e.target.closest('.tab'); if(!t) return;
  curCat = t.dataset.cat;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===t));
  render();
});
qInput.addEventListener('input', render);

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const kw = qInput.value.trim().toLowerCase();
  const list = MODELS.filter(m=>{
    if(curCat!=='全部' && m.cat!==curCat) return false;
    if(!kw) return true;
    return (m.name+m.tag+m.thought+(m.points||[]).join('')+(m.scenes||[]).join('')+(m.explain||'')).toLowerCase().includes(kw);
  });
  // 分类简介
  if(curCat!=='全部' && !kw){
    catIntro.className='cat-intro show';
    catIntro.innerHTML = `<div class="ci-head"><div class="ci-bar" style="background:${cc(curCat)}"></div><h2>${curCat}</h2></div><p>${esc(CATS[curCat].desc)}</p>`;
  } else {
    catIntro.className='cat-intro';
    catIntro.innerHTML='';
  }
  rc.textContent = kw ? `找到 ${list.length} 個結果` : `${list.length} 個模型`;
  if(!list.length){ grid.innerHTML = `<div class="empty">沒有找到匹配的模型，換個關鍵詞試試～</div>`; return; }
  grid.innerHTML = list.map(m=>`
    <div class="card" style="--cc:${cc(m.cat)}" onclick="openDetail('${m.no}')">
      <div class="no">No.${esc(m.no)}</div>
      <h3>${esc(m.name)}</h3>
      <div class="tag">${esc(m.tag)}</div>
      <div class="chips"><span class="chip">${esc(m.cat)}</span></div>
    </div>`).join('');
}

function openDetail(no){
  const m = noMap[no]; if(!m) return;
  const color = cc(m.cat);
  const relHtml = (m.related||[]).map(r=>{
    const t = byName[r] || MODELS.find(x=>x.name.includes(r) || (r&&x.name&&r.includes(x.name)));
    if(t) return `<span class="rel-chip" style="--cc:${cc(t.cat)}" onclick="event.stopPropagation();openDetail('${t.no}')">${esc(r)}</span>`;
    return `<span class="rel-chip off">${esc(r)}</span>`;
  }).join('');
  const pts = (m.points||[]).map(p=>`<li>${esc(p)}</li>`).join('');
  const scs = (m.scenes||[]).map(s=>`<li>${esc(s)}</li>`).join('');
  // 下一个模型（按当前列表顺序）
  const idx = MODELS.findIndex(x=>x.no===m.no);
  const nx = MODELS[(idx+1)%MODELS.length];

  detailBody.innerHTML = `
    <div class="d-top">
      <span class="no">No.${esc(m.no)}</span>
      <span class="cat" style="color:${color}">${esc(m.cat)}</span>
      <span>視頻 BV：${esc(m.bv)}</span>
    </div>
    <h1 class="d-title">${esc(m.name)}</h1>
    <p class="d-tag">${esc(m.tag)}</p>

    <div class="d-sec" style="--cc:${color}">
      <h4>核心思想</h4>
      <div class="d-box"><p>${esc(m.thought)}</p></div>
    </div>

    <div class="d-sec" style="--cc:${color}">
      <h4>關鍵要點</h4>
      <ul class="d-pts">${pts}</ul>
    </div>

    <div class="d-sec" style="--cc:${color}">
      <h4>適用場景</h4>
      <ul class="d-pts">${scs}</ul>
    </div>

    <div class="d-sec" style="--cc:${color}">
      <h4>博主講解</h4>
      <p class="d-text">${esc(m.explain)}</p>
    </div>

    <div class="d-sec" style="--cc:${color}">
      <h4>延伸學習</h4>
      <p class="d-text">${esc(m.extend)}</p>
    </div>

    <div class="d-sec" style="--cc:${color}">
      <h4>實用提醒</h4>
      <div class="d-box"><p>${esc(m.tips)}</p></div>
    </div>

    <div class="d-sec" style="--cc:${color}">
      <h4>同根模型 · ${esc(m.cat)}</h4>
      <div class="rel-chips">${relHtml}</div>
    </div>

    <div class="d-foot">📺 原視頻：<a href="https://www.bilibili.com/video/${esc(m.bv)}" target="_blank" rel="noopener">bilibili.com/video/${esc(m.bv)}</a>（檀東東Tango）</div>

    <div class="d-next">
      <span class="lbl">下一篇</span>
      <a href="javascript:void(0)" onclick="event.preventDefault();openDetail('${nx.no}')">No.${esc(nx.no)} ${esc(nx.name)} →</a>
    </div>
  `;
  crumb.textContent = m.cat + ' · No.' + m.no;
  detail.classList.add('open');
  document.body.style.overflow='hidden';
  detail.scrollTop = 0;
  window.scrollTo(0,0);
}
function closeDetail(){
  detail.classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && detail.classList.contains('open')) closeDetail(); });

render();
</script>
<!--__EDITOR_JS__-->
</body>
</html>
